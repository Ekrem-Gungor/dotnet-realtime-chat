name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Backend quality
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_REDIS_CONNECTION: localhost:6379,defaultDatabase=15,abortConnect=false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore RealtimeChat.sln

      - name: Build
        run: dotnet build RealtimeChat.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test RealtimeChat.sln --configuration Release --no-build --no-restore

      - name: Validate Docker Compose
        run: docker compose --env-file .env.example config --quiet

      - name: Build API image
        run: docker build --file src/presentation/webapi/RealtimeChat.Api/Dockerfile --tag realtimechat-api:ci .

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/presentation/webui/realtimechat.ui

    env:
      VITE_API_BASE_URL: http://localhost:5258
      VITE_SIGNALR_HUB_URL: http://localhost:5258/chatHub

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/presentation/webui/realtimechat.ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
