name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_REDIS_CONNECTION: localhost:6379,defaultDatabase=15,abortConnect=false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore RealtimeChat.sln

      - name: Build
        run: dotnet build RealtimeChat.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test RealtimeChat.sln --configuration Release --no-build --no-restore
