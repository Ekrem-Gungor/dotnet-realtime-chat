name: realtimechat

services:
  web:
    build:
      context: ./src/presentation/webui/realtimechat.ui
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-5173}:8080"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/presentation/webapi/RealtimeChat.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__RealtimeChatConnection: Server=sqlserver,1433;Database=RealtimeChat;User Id=sa;Password=${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True;
      Database__ApplyMigrations: "true"
      DemoIdentity__Enabled: "true"
      DemoIdentity__UserName: ${DEMO_USER_NAME:-realtime.demo}
      DemoIdentity__Email: ${DEMO_USER_EMAIL:-realtime.demo@example.invalid}
      DemoIdentity__Password: ${DEMO_USER_PASSWORD:?Set DEMO_USER_PASSWORD in .env}
      JwtSettings__Issuer: RealtimeChat.Api
      JwtSettings__Audience: RealtimeChat.Client
      JwtSettings__SecretKey: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      JwtSettings__ExpireMinutes: 60
      Redis: redis:6379,abortConnect=false
      UICORSPath: ${UI_CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "${API_PORT:-5258}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env}
    ports:
      - "${SQL_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" -b -o /dev/null
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  sqlserver-data:
